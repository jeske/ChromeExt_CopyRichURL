<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Copy Rich URL</title>
  <style>
    body {
      width: 200px;
      padding: 10px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    button:hover {
      background-color: #45a049;
    }
    button:active {
      background-color: #3d8b40;
    }
  </style>
</head>
<body>
  <button id="copy-button">Copy Current URL</button>
  <script src="popup.js"></script>
</body>
</html>
